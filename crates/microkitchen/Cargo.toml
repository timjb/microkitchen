[package]
name = "microkitchen"
description = "Launch microsandbox VMs from a mise.toml, with interactive egress control."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autotests = false

[lib]
name = "microkitchen"
path = "lib/lib.rs"

[[bin]]
name = "microkitchen"
path = "bin/main.rs"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[[test]]
name = "config_discovery"
path = "tests/config_discovery.rs"

[[test]]
name = "mise_cache_volume"
path = "tests/mise_cache_volume.rs"

[[test]]
name = "docker_in_sandbox"
path = "tests/docker_in_sandbox.rs"

[[test]]
name = "env_and_secrets"
path = "tests/env_and_secrets.rs"

[[test]]
name = "labels"
path = "tests/labels.rs"

[[test]]
name = "ports"
path = "tests/ports.rs"

[[test]]
name = "network_policy"
path = "tests/network_policy.rs"

[[test]]
name = "unresolved_address"
path = "tests/unresolved_address.rs"

[[test]]
name = "laundering"
path = "tests/laundering.rs"

[[test]]
name = "udp_policy"
path = "tests/udp_policy.rs"

[[test]]
name = "resolver_bypass"
path = "tests/resolver_bypass.rs"

[[test]]
name = "two_sandboxes"
path = "tests/two_sandboxes.rs"

[[test]]
name = "process_attribution"
path = "tests/process_attribution.rs"

[[test]]
name = "rate_limit"
path = "tests/rate_limit.rs"

[[test]]
name = "broker_restart"
path = "tests/broker_restart.rs"

[[test]]
name = "dialog_backend"
path = "tests/dialog_backend.rs"

[[test]]
name = "remodel"
path = "tests/remodel.rs"

[[test]]
name = "global_rules"
path = "tests/global_rules.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
hickory-proto = "0.26.3"
indicatif = "0.18.6"
ipnet = "2.12.2"
libc = "0.2.189"
microsandbox = "=0.6.18"
microsandbox-network = "=0.6.18"
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
test-macros.workspace = true
test-utils.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
