[tools]
rust = { version = "1.98", profile = "default" }
node = "24"
pnpm = "latest"
claude = "latest"

[tasks.default]
depends = ["test"]

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks.test]
description = "Unit tests and VM-free integration tests"
run = "cargo test --workspace"

[tasks."test:scripts"]
description = "The guest attribution script (scripts/guest/whodial.sh) against fake /proc trees"
run = "cargo test -p microkitchen --lib broker::attribution"

[tasks."test:integration"]
description = "Tests that boot microVMs (need KVM)"
env = { MK_TEST_ISOLATE_HOME = "1" }
run = "cargo nextest run --workspace --run-ignored=only --test-threads 2"

[tasks."test:vm"]
description = "The VM tests without cargo-nextest, one at a time, against ~/.microkitchen/microsandbox"
run = "cargo test --workspace -- --ignored --test-threads 1"

[tasks.lint]
description = "rustfmt and clippy, warnings are errors"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.check]
description = "What CI runs on hosted runners"
depends = ["lint", "test"]

[tasks.install]
description = "Install the microkitchen binary into ~/.cargo/bin"
run = "cargo install --locked --path crates/microkitchen"

[tasks."docs:dev"]
description = "Serve the documentation site with live reload"
depends = ["docs:install"]
run = "pnpm run docs:dev"

[tasks."docs:build"]
description = "Build the documentation site into docs/.vitepress/dist"
depends = ["docs:install"]
run = "pnpm run docs:build"

[tasks."docs:install"]
hide = true
run = "pnpm install --frozen-lockfile"

[bootstrap.packages]
"apt:build-essential" = "latest"

[_.microkitchen]
mounts = ["./:/workdir"]

[_.microkitchen.network]
allow = ["api.anthropic.com", "release-assets.githubusercontent.com", "raw.githubusercontent.com", "platform.claude.com", "downloads.claude.ai", "mcp-proxy.anthropic.com", "api.github.com", "github.com", "static.rust-lang.org", "index.crates.io", "static.crates.io", "nodejs.org", "crates.io"]
deny = ["http-intake.logs.us5.datadoghq.com"]
