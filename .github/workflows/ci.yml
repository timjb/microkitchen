name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the Rust toolchain from mise.toml, and mise itself, which the
      # VM-free tests run (config discovery, environment resolution).
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      # microsandbox's krun-based VMM backend links against libcap-ng.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - run: mise run lint
      - run: mise run test

  integration:
    name: VM integration tests
    # Boots microVMs, so it needs /dev/kvm. GitHub's standard Linux runners
    # expose it, though nested virtualization is not officially supported.
    # Runs only on demand and for main.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      # /dev/kvm exists but is only accessible to root and the kvm group.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || {
            echo "/dev/kvm is not usable on this runner" >&2
            exit 1
          }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: VM tests
        run: mise run test:integration
